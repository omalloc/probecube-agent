name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Prepare public node CA
        env:
          NODE_CA_PEM: ${{ vars.NODE_CA_PEM }}
        run: |
          if [ -z "$NODE_CA_PEM" ]; then
            echo '::error::Set the repository variable NODE_CA_PEM to the public CA certificate in PEM format.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/node-ca"
          printf '%s\n' "$NODE_CA_PEM" > "$RUNNER_TEMP/node-ca/node-ca.pem"
          if grep -q 'PRIVATE KEY' "$RUNNER_TEMP/node-ca/node-ca.pem"; then
            echo '::error::NODE_CA_PEM must contain only the public CA certificate, never a private key.'
            exit 1
          fi
          openssl x509 -in "$RUNNER_TEMP/node-ca/node-ca.pem" -noout

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-contexts: |
            node-ca=${{ runner.temp }}/node-ca
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
